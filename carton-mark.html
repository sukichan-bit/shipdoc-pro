<title>Carton Mark Generator — IM8</title>

<style>
/* ============================================================
   RESET & TOKENS
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --burgundy:   #50000B;
  --red:        #A40011;
  --flamingo:   #FF9693;
  --blush:      #E1CBB9;
  --cream:      #F5EDE0;
  --offwhite:   #FAF6F2;
  --white:      #FFFFFF;
  --text-maroon:#5A000B;
  --text-black: #1A0508;
  --text-gray:  #8C7A6E;
  --border-soft:  rgba(90,0,11,0.12);
  --border-strong:rgba(90,0,11,0.22);
  --shadow-mark: 0 12px 32px rgba(80,0,11,0.16);
  --radius: 10px;
}
html, body { height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: #EFE7DE;
  color: var(--text-black);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button { cursor: pointer; font-family: inherit; }
input { font-family: inherit; }
h2 { font-family: 'Fraunces', serif; font-weight: 500; }

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px;
  background: var(--burgundy);
  color: var(--white);
  flex: 0 0 auto;
  box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  z-index: 10;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.topbar-logo { height: 26px; filter: brightness(0) invert(1); }
.topbar-title { font-family: 'Fraunces', serif; font-size: 19px; line-height: 1.1; }
.topbar-sub { font-size: 11.5px; color: var(--flamingo); letter-spacing: 0.03em; margin-top: 2px; }
.topbar-actions { display: flex; gap: 10px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 600;
  letter-spacing: 0.01em; transition: transform 0.1s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--red); color: var(--white); }
.btn.primary:hover { opacity: 0.9; }
.btn.outline { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.4); }
.topbar .btn.outline:hover { background: rgba(255,255,255,0.1); }
.btn-sm {
  border: none; border-radius: 6px; padding: 6px 11px; font-size: 12px; font-weight: 600;
  background: var(--red); color: var(--white);
}
.btn-sm.outline { background: transparent; color: var(--text-maroon); border: 1.5px solid var(--border-strong); }
.btn-sm.outline:hover { background: var(--cream); }
.icon-btn {
  border: none; background: transparent; color: var(--text-gray); font-size: 14px;
  width: 26px; height: 26px; border-radius: 6px; line-height: 1;
}
.icon-btn:hover { background: var(--cream); color: var(--text-maroon); }
.icon-btn.danger:hover { background: #FBE2E2; color: var(--red); }

/* ============================================================
   APP BODY — two columns
   ============================================================ */
.app-body { flex: 1 1 auto; display: flex; min-height: 0; }

.control-panel {
  width: 400px; flex: 0 0 400px;
  background: var(--white);
  border-right: 1px solid var(--border-soft);
  overflow-y: auto;
  padding: 20px 22px 60px;
}
.preview-panel {
  flex: 1 1 auto;
  overflow: auto;
  padding: 28px;
  background:
    radial-gradient(ellipse 60% 50% at 15% 0%, rgba(164,0,17,0.05) 0%, transparent 70%),
    #EFE7DE;
}

/* ---- control panel sections ---- */
.panel-section { margin-bottom: 26px; }
.panel-section h2 { font-size: 15px; color: var(--text-maroon); margin-bottom: 12px; }
.panel-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.panel-section-head h2 { margin-bottom: 0; }
.panel-section.collapsible h2 { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.panel-section.collapsible .chev { font-size: 11px; color: var(--text-gray); }

.field-row { margin-bottom: 10px; }
.field-row label {
  display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-gray); margin-bottom: 4px;
}
.field-row input {
  width: 100%; padding: 8px 10px; border: 1.5px solid var(--border-soft); border-radius: 7px;
  font-size: 13.5px; color: var(--text-black); background: var(--offwhite);
}
.field-row input:focus { outline: none; border-color: var(--red); background: var(--white); }
.field-row.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.empty-hint { font-size: 12.5px; color: var(--text-gray); line-height: 1.5; padding: 10px 0; }

/* ---- format toggle ---- */
.format-toggle { display: flex; flex-direction: column; gap: 8px; }
.format-toggle button {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  text-align: left; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border-soft);
  background: var(--offwhite); font-weight: 700; font-size: 13px; color: var(--text-maroon);
}
.format-toggle button span { font-weight: 400; font-size: 11px; color: var(--text-gray); }
.format-toggle button.active { border-color: var(--red); background: #FDECEC; }
.format-toggle button.active span { color: var(--red); }

/* ---- sku library table ---- */
.sku-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.sku-table td { padding: 4px 4px; }
.sku-table input {
  width: 100%; padding: 6px 8px; border: 1.5px solid var(--border-soft); border-radius: 6px;
  font-size: 12.5px; background: var(--offwhite);
}
.sku-table input:focus { outline: none; border-color: var(--red); background: var(--white); }

/* ---- carton cards ---- */
.carton-card {
  border: 1.5px solid var(--border-soft); border-radius: var(--radius);
  padding: 14px; margin-bottom: 14px; background: var(--offwhite);
}
.carton-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.carton-ref-input {
  flex: 1; font-family: 'Fraunces', serif; font-size: 14.5px; font-weight: 500; color: var(--text-maroon);
  border: none; background: transparent; border-bottom: 1.5px dashed transparent; padding: 2px 2px;
}
.carton-ref-input:focus { outline: none; border-bottom-color: var(--red); }
.carton-card-actions { display: flex; gap: 2px; }

.warn-badge {
  font-size: 11px; color: #A15400; background: #FFF3E0; border: 1px solid #F3D8A6;
  border-radius: 6px; padding: 5px 8px; margin-bottom: 8px;
}

.item-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.item-table th {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-gray);
  text-align: left; padding: 2px 4px 4px;
}
.item-table td { padding: 3px 4px; }
.item-table td:nth-child(3) { width: 62px; }
.item-table td:nth-child(4) { width: 24px; }
.item-table input {
  width: 100%; padding: 6px 8px; border: 1.5px solid var(--border-soft); border-radius: 6px;
  font-size: 12.5px; background: var(--white);
}
.item-table input:focus { outline: none; border-color: var(--red); }

.carton-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.carton-total { font-size: 12.5px; color: var(--text-gray); }
.carton-total strong { color: var(--red); font-size: 14px; }

/* ============================================================
   PREVIEW PANEL
   ============================================================ */
.preview-grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.empty-preview {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-gray); text-align: center; gap: 6px; padding-top: 80px;
}
.empty-preview p:first-child { font-family: 'Fraunces', serif; font-size: 20px; color: var(--text-maroon); }

.preview-card { display: flex; flex-direction: column; gap: 10px; }
.preview-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.preview-card-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-maroon);
  background: var(--blush); padding: 4px 10px; border-radius: 999px;
}
.preview-card-actions { display: flex; gap: 6px; }
.preview-stage {
  overflow: hidden; position: relative; box-shadow: var(--shadow-mark); border-radius: 4px; background: var(--white);
}
.preview-scaled { transform-origin: top left; position: absolute; top: 0; left: 0; }

/* ============================================================
   PRINT
   ============================================================ */
#printArea { display: none; margin: 0; padding: 0; }
.print-page { page-break-after: always; }
.print-page:last-child { page-break-after: auto; }

@media print {
  html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { display: block !important; position: absolute; left: 0; top: 0; }
  .no-print { display: none !important; }
}
</style>
</head>

    <div>

    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn outline" onclick="clearAll()">Clear All</button>
    <button class="btn primary" onclick="printAll()">🖨 Print All</button>
  </div>
</header>

<div class="app-body">
  <aside class="control-panel no-print" id="controlPanel"></aside>
  <main class="preview-panel" id="previewPanel"></main>
</div>

/* ============================================================
   STORAGE
   ============================================================ */
const STORE_KEYS = { settings: 'cm_settings', skus: 'cm_skuLibrary', cartons: 'cm_cartons' };

function loadStore(key, fallback) {
  try {
    const raw = localStorage.getItem(STORE_KEYS[key]);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveStore(key, val) { localStorage.setItem(STORE_KEYS[key], JSON.stringify(val)); }

let settings = loadStore('settings', {
  shipper: 'IM8 Health · Prenetics Global',
  consignee: '',
  footerLeft: 'IM8 HEALTH · IM8HEALTH.COM',
  footerRight: 'KEEP DRY · STORE BELOW 25°C',
  format: '1a',
});
let skuLibrary = loadStore('skus', []);
let cartons = loadStore('cartons', []);
let skuLibOpen = false;

/* ============================================================
   HELPERS
   ============================================================ */
function esc(str) {
  return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(str) { return esc(str).replace(/"/g, '&quot;'); }
function uid() { return 'id' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function sanitizeFilename(str) { return String(str || 'carton').replace(/[^a-zA-Z0-9_\-]/g, '_'); }
function cartonTotal(carton) { return carton.items.reduce((s, it) => s + (parseInt(it.qty) || 0), 0); }

/* ============================================================
   MARK GENERATORS — 1A / 1B / 1C
   Kept as inline-styled HTML to match the approved design mockup
   exactly (mm-accurate, print === on-screen preview === PNG export).
   ============================================================ */
function skuRows1a(items) {
  return items.map((it, i) => `
    <div style="display:grid;grid-template-columns:52mm 1fr 26mm;gap:5mm;padding:5mm;border-bottom:1px solid rgba(90,0,11,.14);align-items:center;${i % 2 ? 'background:#F5EDE0;' : ''}">
      <div style="font-size:12pt;font-weight:700;color:#50000B;letter-spacing:.02em;">${esc(it.sku)}</div>
      <div style="font-size:11pt;color:#1A0508;line-height:1.2;">${esc(it.name)}</div>
      <div style="font-size:14pt;font-weight:700;color:#1A0508;text-align:right;">${parseInt(it.qty) || 0}</div>
    </div>`).join('');
}

function mark1aHtml(carton, idx) {
  const total = cartonTotal(carton);
  return `
  <div style="width:297mm;height:210mm;background:#FAF6F2;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;font-family:'Inter',sans-serif;">

      <img src="${LOGO_DATA}" alt="IM8" style="height:9mm;filter:brightness(0) invert(1);">

        <div style="font-family:'Fraunces',serif;font-size:16pt;color:#FFFFFF;line-height:1.1;">${esc(carton.ref || ('Carton ' + (idx + 1)))}</div>

    <div style="padding:5mm 14mm;display:flex;flex-direction:column;gap:3mm;flex:1;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:3mm 8mm;">

        <div style="display:flex;align-items:baseline;gap:4mm;">

function skuRows1b(items) {
  return items.map((it) => `
    <div style="display:grid;grid-template-columns:48mm 1fr 22mm;gap:4mm;padding:3.5mm 0;border-bottom:1px solid rgba(90,0,11,.12);align-items:center;">
      <div style="font-size:12pt;font-weight:700;color:#50000B;">${esc(it.sku)}</div>
      <div style="font-size:12pt;color:#1A0508;line-height:1.2;">${esc(it.name)}</div>
      <div style="font-size:15pt;font-weight:700;color:#1A0508;text-align:right;">${parseInt(it.qty) || 0}</div>
    </div>`).join('');
}

function mark1bHalfHtml(carton, idx, withCutBorder) {
  const total = cartonTotal(carton);
  const border = withCutBorder ? 'border-bottom:1px dashed rgba(90,0,11,.35);' : '';
  return `
  <div style="width:210mm;height:148.5mm;padding:10mm 12mm;display:flex;flex-direction:column;gap:4mm;box-sizing:border-box;background:#FAF6F2;font-family:'Inter',sans-serif;${border}">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid #50000B;padding-bottom:4mm;">
      <img src="${LOGO_DATA}" alt="IM8" style="height:8mm;">
      <div style="font-size:10pt;font-weight:700;letter-spacing:.2em;color:#A40011;">CARTON MARK</div>
    </div>
    <div style="font-size:9pt;color:#8C7A6E;">${esc(carton.ref || ('Carton ' + (idx + 1)))}</div>
    <div style="display:grid;grid-template-columns:48mm 1fr 22mm;gap:4mm;padding-bottom:2mm;border-bottom:1px solid rgba(90,0,11,.20);">
      <div style="font-size:9pt;font-weight:700;letter-spacing:.14em;color:#8C7A6E;">SKU</div>
      <div style="font-size:9pt;font-weight:700;letter-spacing:.14em;color:#8C7A6E;">ITEM NAME</div>
      <div style="font-size:9pt;font-weight:700;letter-spacing:.14em;color:#8C7A6E;text-align:right;">QTY</div>
    </div>
    ${skuRows1b(carton.items)}
    <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:#50000B;padding:4mm 5mm;">
      <div style="font-size:10pt;font-weight:700;letter-spacing:.14em;color:#FFFFFF;">TOTAL UNITS</div>
      <div style="font-family:'Fraunces',serif;font-size:22pt;line-height:1;color:#FFFFFF;">${total}</div>
    </div>
  </div>`;
}

function blank1bHalfHtml() {
  return `<div style="width:210mm;height:148.5mm;box-sizing:border-box;background:#FAF6F2;"></div>`;
}

function skuBlocks1c(items) {
  return items.map((it) => `
    <div style="display:flex;flex-direction:column;gap:2mm;padding-bottom:3mm;border-bottom:1px solid rgba(90,0,11,.14);">
      <div style="font-size:8.5pt;font-weight:700;letter-spacing:.14em;color:#8C7A6E;">SKU</div>
      <div style="font-size:13pt;font-weight:700;color:#50000B;">${it.sku ? esc(it.sku) : '&nbsp;'}</div>
      <div style="font-size:11pt;color:#1A0508;line-height:1.25;">${esc(it.name)}</div>
      <div style="display:flex;align-items:baseline;gap:3mm;">
        <span style="font-size:8.5pt;font-weight:700;letter-spacing:.14em;color:#8C7A6E;">QTY</span>
        <span style="font-size:18pt;font-weight:700;color:#A40011;">${parseInt(it.qty) || 0}</span>
      </div>
    </div>`).join('');
}

function mark1cHtml(carton, idx) {
  const total = cartonTotal(carton);
  return `
  <div style="width:100mm;height:150mm;background:#FFFFFF;display:flex;flex-direction:column;box-sizing:border-box;border:1px solid rgba(90,0,11,.2);font-family:'Inter',sans-serif;">
    <div style="background:#50000B;padding:5mm 6mm;display:flex;flex-direction:column;gap:2mm;">
      <img src="${LOGO_DATA}" alt="IM8" style="height:7mm;align-self:flex-start;filter:brightness(0) invert(1);">
      <div style="font-size:9pt;font-weight:700;letter-spacing:.2em;color:#FF9693;">CARTON MARK</div>
      <div style="font-size:8pt;color:#fff;opacity:.8;">${esc(carton.ref || ('Carton ' + (idx + 1)))}</div>
    </div>
    <div style="padding:5mm 6mm;display:flex;flex-direction:column;gap:3mm;flex:1;">
      ${skuBlocks1c(carton.items)}
      <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;background:#E1CBB9;padding:3.5mm 4mm;border-radius:6px;">
        <div style="font-size:9pt;font-weight:700;letter-spacing:.12em;color:#50000B;">TOTAL UNITS</div>
        <div style="font-family:'Fraunces',serif;font-size:20pt;line-height:1;color:#50000B;">${total}</div>
      </div>
    </div>
  </div>`;
}

function renderMarkStandalone(carton, idx) {
  if (settings.format === '1a') return mark1aHtml(carton, idx);
  if (settings.format === '1c') return mark1cHtml(carton, idx);
  return mark1bHalfHtml(carton, idx, false);
}

/* ============================================================
   CONTROL PANEL RENDER
   ============================================================ */
function renderSkuLibraryHtml() {
  if (!skuLibrary.length) {
    return `<p class="empty-hint">No saved SKUs yet — add one below, or just type SKU / item name directly into a carton line.</p>`;
  }
  return `<table class="sku-table"><tbody>${skuLibrary.map(s => `
    <tr>
      <td><input value="${escAttr(s.sku)}" placeholder="SKU" oninput="updateSku('${s.id}','sku',this.value)"></td>
      <td><input value="${escAttr(s.name)}" placeholder="Item name" oninput="updateSku('${s.id}','name',this.value)"></td>
      <td><button class="icon-btn danger" onclick="deleteSku('${s.id}')" title="Delete">✕</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function cartonCardHtml(carton, idx) {
  const total = cartonTotal(carton);
  const max = FORMATS[settings.format].maxSkus;
  const warn = carton.items.length > max
    ? `<div class="warn-badge">⚠ ${carton.items.length} SKUs on this carton — ${FORMATS[settings.format].label} comfortably fits ${max}. Consider splitting it.</div>`
    : '';
  return `
  <div class="carton-card" id="carton-${carton.id}">
    <div class="carton-card-head">
      <input class="carton-ref-input" value="${escAttr(carton.ref)}" oninput="updateCartonRef('${carton.id}', this.value)">
      <div class="carton-card-actions">
        <button class="icon-btn" onclick="duplicateCarton('${carton.id}')" title="Duplicate carton">⧉</button>
        <button class="icon-btn danger" onclick="removeCarton('${carton.id}')" title="Delete carton">✕</button>
      </div>
    </div>
    ${warn}
    <table class="item-table">
      <thead><tr><th>SKU</th><th>Item name</th><th>Qty</th><th></th></tr></thead>
      <tbody>
        ${carton.items.map((it, i) => `
          <tr>
            <td><input list="skuOptions" value="${escAttr(it.sku)}" placeholder="SKU" oninput="updateItem('${carton.id}',${i},'sku',this.value)"></td>
            <td><input value="${escAttr(it.name)}" placeholder="Item name" oninput="updateItem('${carton.id}',${i},'name',this.value)"></td>
            <td><input type="number" min="0" value="${it.qty}" oninput="updateItem('${carton.id}',${i},'qty',this.value)"></td>
            <td><button class="icon-btn" onclick="removeItem('${carton.id}',${i})" title="Remove line">✕</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="carton-card-foot">
      <button class="btn-sm outline" onclick="addItem('${carton.id}')">+ Add line</button>
      <span class="carton-total">Total: <strong id="total-${carton.id}">${total}</strong> units</span>
    </div>
  </div>`;
}

function renderControlPanel() {
  document.getElementById('controlPanel').innerHTML = `
    <section class="panel-section">
      <h2>Shipment details</h2>
      <div class="field-row">
        <label>Shipper</label>
        <input value="${escAttr(settings.shipper)}" oninput="updateSetting('shipper', this.value)">
      </div>
      <div class="field-row">
        <label>Consignee</label>
        <input value="${escAttr(settings.consignee)}" placeholder="Leave blank to fill by hand" oninput="updateSetting('consignee', this.value)">
      </div>
      <div class="field-row two-col">
        <div>
          <label>Footer — left</label>
          <input value="${escAttr(settings.footerLeft)}" oninput="updateSetting('footerLeft', this.value)">
        </div>
        <div>
          <label>Footer — right</label>
          <input value="${escAttr(settings.footerRight)}" oninput="updateSetting('footerRight', this.value)">
        </div>
      </div>
    </section>

    <section class="panel-section">
      <h2>Format</h2>
      <div class="format-toggle">
        <button class="${settings.format === '1a' ? 'active' : ''}" onclick="setFormat('1a')">1A — A4 Landscape<span>Full sheet · up to 6 SKUs · 297×210mm</span></button>
        <button class="${settings.format === '1b' ? 'active' : ''}" onclick="setFormat('1b')">1B — A5 Two-up<span>Cut in half · up to 3 SKUs each · 210×297mm</span></button>
        <button class="${settings.format === '1c' ? 'active' : ''}" onclick="setFormat('1c')">1C — 4×6in Thermal<span>Adhesive label · up to 3 SKUs · 100×150mm</span></button>
      </div>
    </section>

    <section class="panel-section collapsible">
      <h2 onclick="toggleSkuLib()">SKU Library <span class="chev">${skuLibOpen ? '▾' : '▸'}</span></h2>
      <div style="${skuLibOpen ? '' : 'display:none;'}">
        ${renderSkuLibraryHtml()}
        <button class="btn-sm outline" onclick="addSkuRow()">+ Add SKU</button>
      </div>
    </section>

    <section class="panel-section">
      <div class="panel-section-head">
        <h2>Cartons (${cartons.length})</h2>
        <button class="btn-sm primary" onclick="addCarton()">+ Add Carton</button>
      </div>
      ${cartons.length ? cartons.map((c, i) => cartonCardHtml(c, i)).join('') : `<p class="empty-hint">Click "+ Add Carton" to start building your marks.</p>`}
    </section>

    <datalist id="skuOptions">${skuLibrary.map(s => `<option value="${escAttr(s.sku)}">${escAttr(s.name)}</option>`).join('')}</datalist>
  `;
}

/* ============================================================
   PREVIEW PANEL RENDER
   ============================================================ */
function previewCard(innerHtml, wmm, hmm, scale, labelHtml, actionsHtml) {
  const scaledW = (wmm * scale).toFixed(2);
  const scaledH = (hmm * scale).toFixed(2);
  return `
    <div class="preview-card">
      <div class="preview-card-head">
        <span class="preview-card-label">${labelHtml}</span>
        <div class="preview-card-actions">${actionsHtml}</div>
      </div>
      <div class="preview-stage" style="width:${scaledW}mm;height:${scaledH}mm;">
        <div class="preview-scaled" style="width:${wmm}mm;height:${hmm}mm;transform:scale(${scale});">
          ${innerHtml}
        </div>
      </div>
    </div>`;
}

function renderPreview() {
  const panel = document.getElementById('previewPanel');
  if (!cartons.length) {
    panel.innerHTML = `<div class="empty-preview"><p>No cartons yet</p><p>Add a carton on the left to see its mark here.</p></div>`;
    return;
  }
  const f = settings.format;
  const meta = FORMATS[f];
  let cardsHtml = '';

  if (f === '1a') {
    cardsHtml = cartons.map((c, i) => previewCard(
      mark1aHtml(c, i), meta.pageW, meta.pageH, meta.previewScale,
      esc(c.ref || ('Carton ' + (i + 1))),
      `<button class="btn-sm" onclick="downloadCartonPng('${c.id}')">Download PNG</button>`
    )).join('');
  } else if (f === '1c') {
    cardsHtml = cartons.map((c, i) => previewCard(
      mark1cHtml(c, i), meta.pageW, meta.pageH, meta.previewScale,
      esc(c.ref || ('Carton ' + (i + 1))),
      `<button class="btn-sm" onclick="downloadCartonPng('${c.id}')">Download PNG</button>`
    )).join('');
  } else {
    let sheets = [];
    for (let i = 0; i < cartons.length; i += 2) {
      const top = cartons[i];
      const bottom = cartons[i + 1];
      const topHtml = mark1bHalfHtml(top, i, true);
      const bottomHtml = bottom ? mark1bHalfHtml(bottom, i + 1, false) : blank1bHalfHtml();
      const sheetHtml = `<div style="width:210mm;height:297mm;">${topHtml}${bottomHtml}</div>`;
      const label = bottom
        ? `${esc(top.ref || ('Carton ' + (i + 1)))} + ${esc(bottom.ref || ('Carton ' + (i + 2)))}`
        : `${esc(top.ref || ('Carton ' + (i + 1)))} (sheet)`;
      const actions = `<button class="btn-sm" onclick="downloadCartonPng('${top.id}')">PNG: ${esc(top.ref)}</button>` +
        (bottom ? `<button class="btn-sm" onclick="downloadCartonPng('${bottom.id}')">PNG: ${esc(bottom.ref)}</button>` : '');
      sheets.push(previewCard(sheetHtml, meta.pageW, meta.pageH, meta.previewScale, label, actions));
    }
    cardsHtml = sheets.join('');
  }

  panel.innerHTML = `<div class="preview-grid">${cardsHtml}</div>`;
}

/* ============================================================
   STATE MUTATIONS
   ============================================================ */
function updateSetting(key, value) {
  settings[key] = value;
  saveStore('settings', settings);
  renderPreview();
}

function setFormat(fmt) {
  settings.format = fmt;
  saveStore('settings', settings);
  renderControlPanel();
  renderPreview();
}

function toggleSkuLib() {
  skuLibOpen = !skuLibOpen;
  renderControlPanel();
}

function addSkuRow() {
  skuLibrary.push({ id: uid(), sku: '', name: '' });
  saveStore('skus', skuLibrary);
  skuLibOpen = true;
  renderControlPanel();
}
function updateSku(id, field, value) {
  const s = skuLibrary.find(x => x.id === id);
  if (!s) return;
  s[field] = value;
  saveStore('skus', skuLibrary);
  const dl = document.getElementById('skuOptions');
  if (dl) dl.innerHTML = skuLibrary.map(x => `<option value="${escAttr(x.sku)}">${escAttr(x.name)}</option>`).join('');
}
function deleteSku(id) {
  skuLibrary = skuLibrary.filter(x => x.id !== id);
  saveStore('skus', skuLibrary);
  renderControlPanel();
}

function addCarton() {
  cartons.push({ id: uid(), ref: `Carton ${cartons.length + 1}`, items: [{ sku: '', name: '', qty: 1 }] });
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}
function removeCarton(id) {
  if (!confirm('Delete this carton mark?')) return;
  cartons = cartons.filter(c => c.id !== id);
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}
function duplicateCarton(id) {
  const idx = cartons.findIndex(c => c.id === id);
  if (idx === -1) return;
  const clone = JSON.parse(JSON.stringify(cartons[idx]));
  clone.id = uid();
  clone.ref = (cartons[idx].ref || `Carton ${idx + 1}`) + ' (copy)';
  cartons.splice(idx + 1, 0, clone);
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}
function updateCartonRef(id, value) {
  const c = cartons.find(x => x.id === id);
  if (!c) return;
  c.ref = value;
  saveStore('cartons', cartons);
  renderPreview();
}

function addItem(cartonId) {
  const c = cartons.find(x => x.id === cartonId);
  if (!c) return;
  c.items.push({ sku: '', name: '', qty: 1 });
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}
function removeItem(cartonId, idx) {
  const c = cartons.find(x => x.id === cartonId);
  if (!c) return;
  c.items.splice(idx, 1);
  if (!c.items.length) c.items.push({ sku: '', name: '', qty: 1 });
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}
function updateItem(cartonId, idx, field, value) {
  const c = cartons.find(x => x.id === cartonId);
  if (!c || !c.items[idx]) return;
  c.items[idx][field] = value;
  if (field === 'sku' && !c.items[idx].name) {
    const match = skuLibrary.find(s => s.sku && s.sku.toLowerCase() === String(value).toLowerCase());
    if (match) {
      c.items[idx].name = match.name;
      const nameInput = document.querySelector(`#carton-${cartonId} tbody tr:nth-child(${idx + 1}) td:nth-child(2) input`);
      if (nameInput) nameInput.value = match.name;
    }
  }
  saveStore('cartons', cartons);
  const totalEl = document.getElementById('total-' + cartonId);
  if (totalEl) totalEl.textContent = cartonTotal(c);
  renderPreview();
}

function clearAll() {
  if (!confirm('Clear all cartons, the SKU library, and shipment details? This cannot be undone.')) return;
  settings = {
    shipper: 'IM8 Health · Prenetics Global', consignee: '',
    footerLeft: 'IM8 HEALTH · IM8HEALTH.COM', footerRight: 'KEEP DRY · STORE BELOW 25°C',
    format: '1a',
  };
  skuLibrary = [];
  cartons = [];
  saveStore('settings', settings);
  saveStore('skus', skuLibrary);
  saveStore('cartons', cartons);
  renderControlPanel();
  renderPreview();
}

/* ============================================================
   PRINT
   ============================================================ */
function buildPrintArea() {
  const f = settings.format;
  const meta = FORMATS[f];
  let html = '';
  if (f === '1a' || f === '1c') {
    cartons.forEach((c, i) => {
      const markHtml = f === '1a' ? mark1aHtml(c, i) : mark1cHtml(c, i);
      html += `<div class="print-page">${markHtml}</div>`;
    });
  } else {
    for (let i = 0; i < cartons.length; i += 2) {
      const top = mark1bHalfHtml(cartons[i], i, true);
      const bottom = cartons[i + 1] ? mark1bHalfHtml(cartons[i + 1], i + 1, false) : blank1bHalfHtml();
      html += `<div class="print-page">${top}${bottom}</div>`;
    }
  }
  document.getElementById('printArea').innerHTML = html;
  document.getElementById('pageSizeStyle').textContent = `@page { size: ${meta.pageW}mm ${meta.pageH}mm; margin: 0; }`;
}

function printAll() {
  if (!cartons.length) { alert('Add at least one carton first.'); return; }
  buildPrintArea();
  requestAnimationFrame(() => requestAnimationFrame(() => window.print()));
}

/* ============================================================
   PNG EXPORT
   ============================================================ */
async function downloadCartonPng(cartonId) {
  const idx = cartons.findIndex(c => c.id === cartonId);
  if (idx === -1) return;
  const carton = cartons[idx];
  const html = renderMarkStandalone(carton, idx);

  const temp = document.createElement('div');
  temp.style.position = 'fixed';
  temp.style.left = '-99999px';
  temp.style.top = '0';
  temp.innerHTML = html;
  document.body.appendChild(temp);

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  try {
    const target = temp.firstElementChild;
    const canvas = await html2canvas(target, { scale: 3, backgroundColor: '#ffffff' });
    document.body.removeChild(temp);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `carton-mark_${sanitizeFilename(carton.ref)}_${settings.format}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  } catch (e) {
    document.body.removeChild(temp);
    alert('PNG export failed: ' + e.message);
  }
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('topbarLogo').src = LOGO_DATA;
renderControlPanel();
renderPreview();
</script>
</body>
</html>
